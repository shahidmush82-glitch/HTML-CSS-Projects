<!DOCTYPE html>
<html>

<head>
    <title>One Page Website</title>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="#home">Home</a> |
        <a href="#gallery">Gallery</a> |
        <a href="#video">Video</a> |
        <a href="#contact">Contact</a>
    </nav>

    <hr>

    <!-- Home Section -->
    <section id="home">
        <h1>Welcome to My Pet Website</h1>
        <p>This is my one-page HTML website assignment.</p>
    </section>

    <hr>

    <!-- Pictures Section -->
    <section id="gallery">
        <h2>Pet Pictures</h2>

        <img src="https://placedog.net/400" width="300">

        <img src="https://placekitten.com/300/200" width="300">
    </section>

    <hr>

    <!-- Video Section -->
    <section id="video">
        <h2>Pet Video</h2>

        <iframe width="560" height="315"
            src="https://www.youtube.com/embed/tgbNymZ7vqY">
        </iframe>
    </section>

    <hr>

    <!-- Contact Form -->
    <section id="contact">

        <h2>Contact Us</h2>

        <form>

            <label>Name:</label><br>
            <input type="text"><br><br>

            <label>Email:</label><br>
            <input type="email"><br><br>

            <label>Message:</label><br>
            <textarea></textarea><br><br>

            <input type="submit" value="Send">

        </form>

    </section>

    <hr>

    <!-- Footer -->
    <footer>
        <p>© 2026 One Page Website Assignment</p>
    </footer>

</body>

</html>
